name: Refresh Huddlepuffers Dashboard

# Cloud replacement for the local launchd job
# (scripts/com.hossautomation.huddlepuffers-refresh.plist).
# Builds and deploys the REDESIGNED dashboard — the live ~1.9MB site — by
# mirroring scripts/refresh_redesign.sh:
#   pull data -> guard season -> build rankings_data.json -> (optional) weekly AI
#   copy -> inject into the redesign template -> deploy to the same Netlify site.
# Runs on a GitHub-hosted runner so the dashboard refreshes whether or not the
# MacBook is open. Deploy target is unchanged: https://huddlepuffers.hossautomation.com

on:
  schedule:
    # Wednesday 12:00 UTC = 7:00 AM ET in-season (EST) / 8:00 AM ET in summer (EDT).
    # GitHub cron is always UTC and does not observe DST.
    - cron: "0 12 * * 3"
    # Thursday backup (v3/B10): a second chance if Wednesday failed. The freshness
    # gate below turns this into a no-op when the live site is already current.
    - cron: "0 12 * * 4"
  workflow_dispatch:
    inputs:
      force_fail:
        description: "Test the failure alert: fail early (before any deploy) to email you"
        type: boolean
        default: false

# contents: commit the regenerated snapshot/digest/AI-copy back to main.
# issues: open a failure-alert issue (which GitHub emails to you).
permissions:
  contents: write
  issues: write

# Never let two refreshes run at once (they'd race on the same Netlify deploy).
concurrency:
  group: huddlepuffers-refresh
  cancel-in-progress: false

jobs:
  # v3/B10: the Thursday cron exists solely as a retry for a failed Wednesday.
  # This gate turns it into a no-op when the live site is already fresh (<5 days).
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.fresh.outputs.skip }}
    steps:
      - name: Freshness check (Thursday backup runs only)
        id: fresh
        run: |
          SKIP=false
          if [ "$(date -u +%u)" = "4" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            GEN=$(curl -sL --max-time 30 https://huddlepuffers.hossautomation.com/ \
              | grep -o '"generated_at":"[^"]*"' | head -1 | cut -d'"' -f4) || true
            if [ -n "$GEN" ]; then
              AGE_DAYS=$(( ( $(date -u +%s) - $(date -u -d "${GEN%%.*}" +%s 2>/dev/null || echo 0) ) / 86400 ))
              echo "live generated_at=$GEN (${AGE_DAYS}d old)"
              [ "$AGE_DAYS" -lt 5 ] && SKIP=true
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          [ "$SKIP" = "true" ] && echo "Live site is fresh — Thursday backup is a no-op." || true

  refresh:
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the commit-back rebase/push is safe

      - name: (test only) Force an early failure to verify the alert
        # Manual dispatch with force_fail=true fails HERE — before any build or
        # deploy — so it exercises the failure-alert path without publishing
        # anything. Scheduled runs never set this input, so it is a no-op for them.
        if: ${{ inputs.force_fail }}
        run: |
          echo "force_fail=true → deliberately failing to test the alert path (nothing deploys)."
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Create working directories
        # git does not track empty dirs; the build scripts assume these exist.
        run: mkdir -p db data/raw data/csv data/snapshots reports logs

      - name: Pull source data
        # Enrichment sources (FantasyCalc / KTC / news) are non-fatal: a flaky
        # feed warns but does not abort the refresh. Sleeper is the spine — if it
        # fails, the downstream build fails the job (so we never deploy stale junk).
        working-directory: scripts
        run: |
          python3 fetch_sleeper.py
          python3 fetch_fantasycalc.py  || echo "::warning::FantasyCalc fetch failed — using prior values"
          python3 fetch_keeptradecut.py || echo "::warning::KeepTradeCut fetch failed — using prior values"
          python3 fetch_nfl_stats.py    || echo "::warning::nfl-data-py fetch failed — using prior stats"
          python3 fetch_news.py         || echo "::warning::ESPN news fetch failed — news section may be stale"

      - name: Guard against a silent season rollover
        # Queries the Sleeper API for a successor league chained to ours; fails
        # LOUDLY (→ failure-alert issue) instead of deploying last year's rosters
        # forever. (v3: API-forward — the old DB-based version could never fire.)
        run: python3 scripts/check_season.py

      - name: Build league data (rankings_data.json)
        # Same pipeline as refresh_platform.sh. build_artifact_v2 is kept because
        # it also sanitizes rankings_data.json (NaN/Infinity -> null) that the
        # redesign build consumes; its own HTML output is just not deployed.
        working-directory: platform
        run: |
          python3 build_rankings.py
          python3 build_platform_v2.py
          python3 build_extras_v3.py
          python3 "$GITHUB_WORKSPACE/scripts/apply_lineup_override.py"
          python3 build_artifact_v2.py

      - name: Validate built data (v3/B3 schema gate)
        # Malformed rankings_data.json or tone-less ai_labels.json fails HERE,
        # before anything is rendered or deployed.
        run: python3 scripts/validate_data.py

      - name: Verify rosters against live Sleeper (v3/B1 ground truth)
        # The check that would have caught the 2026 season freeze: every rostered
        # player in the built data must match the roster Sleeper says they're on.
        run: python3 scripts/verify_rosters.py

      - name: Digest regression fixtures (v3/B5)
        run: python3 scripts/test_digest_fixtures.py

      - name: Write weekly AI copy
        # NO-OP unless ANTHROPIC_API_KEY is set: leaves platform/ai_labels.json as-is
        # and exits 0, so the workflow ships the current (frozen) copy until you
        # opt in. With the key set, Claude rewrites the copy from this week's numbers.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/generate_labels.py

      - name: Build redesigned dashboard (index.html)
        run: python3 scripts/build_redesign.py

      - name: Stage clean deploy directory
        # Publish ONLY the self-contained dashboard + its asset — never the build
        # source (platform/*.py) or other junk in platform/, which would otherwise
        # ship to the public CDN. The redesign is self-contained: index.html + assets/
        # (icons, mascot, iOS splash screens) + manifest.json + sw.js (the service
        # worker behind the home-screen app's offline/instant launch).
        run: |
          rm -rf _site && mkdir -p _site
          cp platform/index.html _site/index.html
          cp -R platform/assets _site/assets
          cp platform/manifest.json _site/manifest.json
          cp platform/sw.js _site/sw.js
          test -f _site/index.html && test -d _site/assets && test -f _site/manifest.json \
            && test -f _site/sw.js && test -d _site/assets/splash \
            || { echo "::error::deploy staging incomplete — refusing to publish"; exit 1; }

      - name: Upload deploy artifact (v3/B10 rollback safety)
        # Keeps every published _site for 90 days — instant rollback material.
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.run_id }}
          path: _site/
          retention-days: 90

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          # Site ID is not a secret (it is gated by the auth token above).
          NETLIFY_SITE_ID: "28e6627e-1460-4cf3-8a06-93d5de474a88"
        run: |
          npx --yes netlify-cli@17 deploy \
            --prod \
            --dir=_site \
            --site="$NETLIFY_SITE_ID" \
            --message="Auto-refresh (GitHub Actions run ${GITHUB_RUN_ID})"

      - name: Smoke-test the LIVE site (v3/B2)
        # Deploy already happened; a failure here trips the alert issue so a bad
        # publish (wrong league, stale CDN, broken toggle) is loud, not silent.
        run: python3 scripts/smoke_test.py

      - name: Snapshot + weekly digest
        working-directory: scripts
        run: python3 weekly_digest.py

      - name: Commit refreshed history + AI copy
        # Non-fatal: deploy is the real deliverable. A git hiccup here (conflict,
        # non-fast-forward) must NOT turn a successful deploy into a red run — the
        # snapshot/digest just re-commits on the next run.
        continue-on-error: true
        run: |
          git config user.name  "huddlepuffers-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshots reports platform/ai_labels.json
          if git diff --staged --quiet; then
            echo "No snapshot/report/label changes to commit."
          else
            git commit -m "chore(refresh): data + AI copy $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Run summary
        if: always() # report even when an earlier step failed
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          {
            echo "## Huddlepuffers refresh"
            echo ""
            if [ -f _site/index.html ]; then
              echo "- ✅ Built + staged for deploy: \`$(wc -c < _site/index.html | tr -d ' ')\` bytes"
            else
              echo "- ⚠️ index.html was NOT produced (build or season guard failed)"
            fi
            if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
              echo "- 🧠 Weekly AI copy: regenerated from this week's numbers"
            else
              echo "- 🧠 Weekly AI copy: frozen (set ANTHROPIC_API_KEY to auto-write it)"
            fi
            echo "- Live: https://huddlepuffers.hossautomation.com"
            echo "- Run \`${GITHUB_RUN_ID}\` · $(date -u '+%Y-%m-%d %H:%M UTC')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Alert on failure (opens an issue → emails you)
        # Fires ONLY if a prior step failed. The commit-back step is non-fatal, so a
        # snapshot hiccup does NOT alert. Opens a GitHub issue and @mentions you, which
        # GitHub delivers as an email — no SMS/SMTP/SendGrid infra or secrets needed.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue create --repo "${GITHUB_REPOSITORY}" \
            --title "🔴 Huddlepuffers weekly refresh failed ($(date -u +%Y-%m-%d))" \
            --body "@Nicholimichael the weekly refresh failed — the live dashboard may be stale. Run: ${RUN_URL} · Likely causes: a season rollover (bump config.py), a dead Netlify/Anthropic key, or a data-source outage. Fix, then re-run from the Actions tab." \
            || echo "::warning::could not open failure issue"
